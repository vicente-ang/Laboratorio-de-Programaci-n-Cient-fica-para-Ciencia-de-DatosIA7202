table: gold.rfm_exclusions
purpose: >-
  Conservar las órdenes entregadas sin pago registrado y su motivo, para
  distinguir "no hubo compra" de "no hay evidencia suficiente para medirla"
  en lugar de imputar un cero en Monetary.
grain: Una fila por order_id excluida del RFM.
primary_key: [order_id]
owner: Equipo de Datos de Pudubella
lineage: [silver.orders, silver.payments]
classification: interno
required_columns:
  - order_id
  - customer_id
  - order_purchase_timestamp
  - reason
column_types:
  order_id: string
  customer_id: string
  order_purchase_timestamp: datetime
  reason: string
allow_empty: true
constraints:
  order_id:
    nullable: false
    unique: true
  customer_id:
    nullable: false
  order_purchase_timestamp:
    nullable: false
  reason:
    nullable: false
    allowed_values:
      - delivered_order_without_payment
