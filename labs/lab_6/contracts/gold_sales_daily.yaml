table: gold.sales_daily
purpose: >-
  Entregar a Operaciones el valor de ítems vendidos y el número de órdenes
  entregadas por día de compra, sin incluir fletes.
grain: Una fila por sale_date, derivada de order_purchase_timestamp.
primary_key: [sale_date]
owner: Equipo de Datos de Pudubella
lineage: [silver.orders, silver.order_items]
classification: interno
required_columns:
  - sale_date
  - items_sold_value
  - delivered_orders
column_types:
  sale_date: date
  items_sold_value: float
  delivered_orders: integer
allow_empty: false
constraints:
  sale_date:
    nullable: false
    unique: true
  items_sold_value:
    nullable: false
    minimum: 0.0
    finite: true
  delivered_orders:
    nullable: false
    minimum: 1
