table: silver.customers
purpose: >-
  Entregar el puente entre el identificador transaccional customer_id y la
  identidad persistente customer_unique_id, sin consolidar personas: esa
  agregación pertenece a gold.customer_rfm.
grain: Una fila por customer_id.
primary_key: [customer_id]
owner: Equipo de Datos de Pudubella
lineage: [bronze.customers]
classification: interno
required_columns:
  - customer_id
  - customer_unique_id
column_types:
  customer_id: string
  customer_unique_id: string
allow_empty: false
constraints:
  customer_id:
    nullable: false
    unique: true
  customer_unique_id:
    nullable: false
